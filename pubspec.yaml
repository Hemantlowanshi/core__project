name: core_project
description: "A new Flutter project."

publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  package_info_plus: ^10.2.1
  flutter_svg: ^2.2.0
  smooth_page_indicator: ^3.0.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.2
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/google-apps-script.png"




flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    -  family: PP-regular
       fonts:
          - asset: assets/fonts/ppmori-regular.otf

    - family: PP-Mori
      fonts:
          - asset: assets/fonts/ppmori-semibold.otf

    - family: Inter-Regular
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf

    - family: Inter-Medium
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf

    - family: Inter-SemiBold
      fonts:
        - asset: assets/fonts/Inter-SemiBold.ttf

    - family: Inter-Bold
      fonts:
        - asset: assets/fonts/Inter-Bold.ttf

